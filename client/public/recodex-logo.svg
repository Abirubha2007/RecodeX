<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" role="img" aria-label="ReCodeX logo">
  <defs>
    <linearGradient id="hexGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="facetGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hexagon icon (48×48, centered vertically in 64px) -->
  <g transform="translate(8, 8)">
    <polygon
      points="24,2 46,14 46,38 24,50 2,38 2,14"
      fill="url(#hexGradL)"
    />
    <polygon
      points="24,2 46,14 24,26 2,14"
      fill="url(#facetGradL)"
      opacity="0.4"
    />
    <!-- Bracket < -->
    <path d="M13 26 L19.5 18.5 L19.5 21.5 L16.5 26 L19.5 30.5 L19.5 33.5 Z" fill="white"/>
    <!-- Bracket > -->
    <path d="M35 26 L28.5 18.5 L28.5 21.5 L31.5 26 L28.5 30.5 L28.5 33.5 Z" fill="white"/>
    <!-- Slash / -->
    <rect x="22" y="16" width="4" height="20" rx="1.5" transform="rotate(-15 24 26)" fill="white" opacity="0.92"/>
  </g>

  <!-- Wordmark: ReCodeX -->
  <!-- Re -->
  <text x="68" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Re</text>
  <!-- Code in emerald -->
  <text x="97" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#059669" letter-spacing="-0.5">Code</text>
  <!-- X -->
  <text x="158" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.5">X</text>

  <!-- Tagline -->
  <text x="68" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="400" fill="#64748b" letter-spacing="0.5">Write · Run · Optimize · Verify</text>
</svg>
